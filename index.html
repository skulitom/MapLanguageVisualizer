<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-visual"
    />
    <title>World Language Map – official languages of every country</title>
    <meta
      name="description"
      content="Interactive world map of official and major languages in 200 countries. See where English, French, Arabic, Swahili or any of 102 languages is official, compare language families, and share the view."
    />
    <meta name="theme-color" content="#0b1424" />
    <meta name="color-scheme" content="dark" />
    <link rel="canonical" href="https://skulitom.github.io/MapLanguageVisualizer/" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="World Language Map" />
    <meta property="og:title" content="World Language Map – official languages of every country" />
    <meta
      property="og:description"
      content="Highlight where any of 102 languages is official, compare language families across 200 countries, and share the view."
    />
    <meta property="og:url" content="https://skulitom.github.io/MapLanguageVisualizer/" />
    <meta property="og:image" content="https://skulitom.github.io/MapLanguageVisualizer/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Dark world map with countries coloured by where English, Spanish, French and Arabic are official."
    />
    <meta name="twitter:card" content="summary_large_image" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "World Language Map",
        "url": "https://skulitom.github.io/MapLanguageVisualizer/",
        "description": "Interactive world map of official and major languages in 200 countries, with language-family view and shareable links.",
        "applicationCategory": "EducationalApplication",
        "operatingSystem": "Any",
        "isAccessibleForFree": true,
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
        "codeRepository": "https://github.com/skulitom/MapLanguageVisualizer",
        "author": { "@type": "Person", "name": "Artem Skulimovskiy", "url": "https://github.com/skulitom" }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>World Language Map needs JavaScript to draw the map.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
